http:
  method: POST
  url: "{{AWTRIX_WEB_URL}}/api/custom?name=Time"
  params:
    - name: name
      value: Time
      type: query
  auth:
    type: basic
    username: "{{AWTRIX_USER}}"
    password: "{{AWTRIX_PASSWORD}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
